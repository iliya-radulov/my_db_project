<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alloy Lab — Synthesis Advisor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .nav-link.active { font-weight: 600; }

    /* Status badges */
    .badge-good      { background: #198754; color: #fff; }
    .badge-solid     { background: #0d6efd; color: #fff; }
    .badge-warning   { background: #fd7e14; color: #fff; }
    .badge-no_target { background: #6c757d; color: #fff; }
    .badge-error     { background: #dc3545; color: #fff; }

    /* Phase fraction bar */
    .frac-bar { height: 6px; background: #dee2e6; border-radius: 3px; }
    .frac-fill { height: 6px; border-radius: 3px; background: #0d6efd; }

    /* Spinner overlay */
    #spinner-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(255,255,255,.75);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }
    #spinner-overlay.show { display: flex; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/">⚗️ Alloy Lab · Advisor</a>
  <ul class="navbar-nav ms-3">
    <li class="nav-item">
      <a class="nav-link {% if active=='advisor' %}active{% endif %}" href="/">Composition Advisor</a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active=='explorer' %}active{% endif %}" href="/explorer">Phase Explorer</a>
    </li>
    <!-- separator -->
    <li class="nav-item">
      <span class="nav-link text-secondary px-2" style="cursor:default;">|</span>
    </li>
    <li class="nav-item">
      <a class="nav-link text-secondary" href="http://localhost:5000" target="_blank"
         title="Open Alloy Database (stage 2)">
        Alloy DB ↗
      </a>
    </li>
  </ul>
  <span class="ms-auto text-secondary small">FE-ND-B · SGTE binaries · pycalphad</span>
</nav>

<div class="container-fluid py-4 px-4">
  {% block content %}{% endblock %}
</div>

<!-- Spinner overlay -->
<div id="spinner-overlay">
  <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
  <div class="text-secondary">Running equilibrium calculations…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
